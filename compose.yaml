services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rfx_estudos
      POSTGRES_USER: rfx_estudos
      POSTGRES_PASSWORD: rfx_estudos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfx_estudos -d rfx_estudos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: rfx_estudos_postgres_data
