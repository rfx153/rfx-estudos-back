# Frontend local
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# PostgreSQL local executado pelo Docker Compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rfx_estudos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rfx_estudos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rfx_estudos}

# As migrações são aplicadas automaticamente no banco local.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
