# Em produção, todas as configurações de conexão são obrigatórias.
app.frontend.url=${FRONTEND_URL}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Permanece desativado até o banco de produção ser registrado como baseline.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# O pool pode ficar completamente ocioso para permitir o scale-to-zero do Neon.
# O endpoint /api/ping não usa o datasource.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=30000
